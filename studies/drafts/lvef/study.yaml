study_id: lvef-draft
site: dicom-miva
seed: 20260921

stages:
  retrieve:
    dsn_env: /data/mi-val/secrets/micdm.env
    schema: cdm
    label_concept_id: 3027172
    modality_concept_id: 4145308  # ECG (image_occurrence also holds MIMIC-CXR chest X-rays)
    window_days: 7
    window_days_sens2: 30
    implausible_below: 5
    primary_cutoff: 40
    sens1_cutoff: 50
    local_path_root: /scratch/mi-val/dicom
    require_local_file: true
    x-proposed:
      extra_cutoffs:
        - {name: lte45, rule: "value <= 45", used_by: echonext-mini}
      note: >-
        Cutoffs are fixed to primary (<= primary_cutoff) and sens1 (< sens1_cutoff)
        in RetrieveSpec (src/mival/stages/retrieve.py:43). A model trained on a
        third cutoff has no label column to score against.

  profile:
    test_fraction: 0.2
    n_folds: 5
    stratify_on: label_primary
    min_test_positives: 100

  preprocess:
    loader: dicom
    registry: registry/models
    allow_upsample: false
    pad_policy: reject
    # perturbation.axes is study-wide: one grid degrades every card in
    # `registry` (see check_grid_against_contract in perturbation.py), but
    # this study's four cards run at 500, 250 and 100 Hz, all at 10 s. No
    # single set of degrading resample/duration levels stays below every
    # card's own contract rate/duration, so a baseline-only level is used for
    # both axes instead: the checker treats a level equal to the axis's own
    # baseline as the identity (it only warns when the baseline is set above
    # a card's contract, never when it matches). lead_dropout and
    # amplitude_scale are unaffected by rate/duration and keep their
    # framework defaults.
    perturbation:
      axes:
        resample: [500]
        duration: [10]

  models:
    registry: registry/drafts
    cohort_sources: [mimic-iv-ecg]
    batch_size: 64
    arms:
      - {model_id: heartwise-lvef-binary, training_mode: inference_only, label_def: primary}
      - {model_id: heartwise-lvef-regression, training_mode: inference_only, label_def: value}
      - {model_id: ecgfounder, training_mode: linear_probe, label_def: primary, hparam_grid: {lr: [0.01, 0.001]}}
      - {model_id: ecgfounder, training_mode: linear_probe, label_def: value, hparam_grid: {lr: [0.01, 0.001]}}
      - {model_id: xecg, training_mode: linear_probe, label_def: primary, hparam_grid: {lr: [0.01, 0.001]}}
      - {model_id: xecg, training_mode: linear_probe, label_def: value, hparam_grid: {lr: [0.01, 0.001]}}
      - {model_id: heartwise-lvef-under50, training_mode: inference_only, label_def: sens1}
      - {model_id: echonext-mini, training_mode: inference_only, label_def: primary}  # true cutoff is <=45, see x-proposed
    x-proposed:
      registries: [registry/models, registry/drafts]
      note: >-
        The six existing arms live in registry/models and the two new ones in
        registry/drafts. models.registry and preprocess.registry each take one
        directory, and preprocess compiles every card in it
        (src/mival/stages/preprocess.py:250).

  evaluate:
    outcomes: {primary: null}
    regression_cuts: [40]
    bootstrap_replicates: 2000
    figures: true
