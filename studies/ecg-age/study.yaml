study_id: ecg-age
site: dicom-miva
seed: 20261007

stages:
  retrieve:
    dsn_env: /data/mi-val/secrets/micdm.env
    schema: cdm
    modality_concept_id: 4145308  # ECG (image_occurrence also holds MIMIC-CXR chest X-rays)
    local_path_root: /scratch/mi-val/dicom
    require_local_file: true
    one_per_person: true
    label_source: {kind: age_at_ecg}

  profile:
    test_fraction: 0.2
    n_folds: 5
    stratify_on: none
    min_test_positives: 0

  preprocess:
    loader: dicom
    allow_upsample: false
    perturbation:
      axes:
        resample: [500]
        duration: [10.24]  # baseline-only, equal to Lima's contract (10 s padded to 4096 at 400 Hz)
    registry: registry/regression
    pad_policy: zero  # Lima centres 10 s in 4096 samples at 400 Hz (pad_anchor: center)

  models:
    registry: registry/regression
    cohort_sources: [mimic-iv-ecg]
    batch_size: 64
    arms:
      - {model_id: lima-ecg-age, training_mode: inference_only, label_def: value}

  evaluate:
    outcomes: {age: null}
    regression_cuts: {value: [65]}
    bootstrap_replicates: 2000
    figures: true
