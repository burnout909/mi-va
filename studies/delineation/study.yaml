study_id: delineation
site: dicom-miva
seed: 20261007

stages:
  retrieve:
    dsn_env: /data/mi-val/secrets/micdm.env
    schema: cdm
    modality_concept_id: 4145308  # ECG (image_occurrence also holds MIMIC-CXR chest X-rays)
    local_path_root: /scratch/mi-val/dicom
    require_local_file: true
    one_per_person: true
    label_source: {kind: machine_measurement, path: /data/mi-val/datasets/mimic-iv-ecg/machine_measurements.csv}

  profile:
    test_fraction: 0.2
    n_folds: 5
    stratify_on: none
    min_test_positives: 0

  preprocess:
    loader: dicom
    allow_upsample: false
    perturbation:
      axes:
        resample: [500]
        duration: [10]
    registry: registry/segmentation
    pad_policy: reject

  models:
    registry: registry/segmentation
    cohort_sources: [mimic-iv-ecg]
    batch_size: 64
    arms:
      - {model_id: semisegecg-resnet18, training_mode: inference_only, label_def: pr}
      - {model_id: semisegecg-resnet18, training_mode: inference_only, label_def: qrs}
      - {model_id: semisegecg-resnet18, training_mode: inference_only, label_def: qt}
      - {model_id: semisegecg-vit-tiny, training_mode: inference_only, label_def: pr}
      - {model_id: semisegecg-vit-tiny, training_mode: inference_only, label_def: qrs}
      - {model_id: semisegecg-vit-tiny, training_mode: inference_only, label_def: qt}
      - {model_id: hrnetv2-delineation, training_mode: inference_only, label_def: pr}
      - {model_id: hrnetv2-delineation, training_mode: inference_only, label_def: qrs}
      - {model_id: hrnetv2-delineation, training_mode: inference_only, label_def: qt}
      - {model_id: openecg-codec-v6, training_mode: inference_only, label_def: pr}
      - {model_id: openecg-codec-v6, training_mode: inference_only, label_def: qrs}
      - {model_id: openecg-codec-v6, training_mode: inference_only, label_def: qt}
      - {model_id: heartkit-seg-tcn, training_mode: inference_only, label_def: pr}
      - {model_id: heartkit-seg-tcn, training_mode: inference_only, label_def: qrs}
      - {model_id: heartkit-seg-tcn, training_mode: inference_only, label_def: qt}

  evaluate:
    outcomes: {interval: null}
    regression_cuts: {pr: [200], qrs: [120], qt: [450]}
    bootstrap_replicates: 2000
    figures: true
