study_id: mortality
site: dicom-miva
seed: 20261007

stages:
  retrieve:
    dsn_env: /data/mi-val/secrets/micdm.env
    schema: cdm
    modality_concept_id: 4145308  # ECG (image_occurrence also holds MIMIC-CXR chest X-rays)
    local_path_root: /scratch/mi-val/dicom
    require_local_file: true
    ecg_selection: {per_person: one, rule: random}
    label_source: {kind: death_within, horizon_days: 365}

  profile:
    test_fraction: 0.2
    n_folds: 5
    stratify_on: label_event
    min_test_positives: 100

  preprocess:
    loader: dicom
    allow_upsample: false
    perturbation:
      axes:
        resample: [500]
        duration: [10]
    registry: registry/survival
    pad_policy: reject

  models:
    registry: registry/survival
    cohort_sources: [mimic-iv-ecg]
    batch_size: 64
    arms:
      - {model_id: cavalab-deepsurv-code15, training_mode: inference_only, label_def: survival}
      - {model_id: cavalab-mtlr-code15, training_mode: inference_only, label_def: survival}
      - {model_id: ml4h-ecg2af, training_mode: inference_only, label_def: survival}
      - {model_id: ml4h-ecg2hf, training_mode: inference_only, label_def: survival}
      - {model_id: ml4h-ecg2stroke, training_mode: inference_only, label_def: survival}

  evaluate:
    outcomes: {death_1y: null}
    horizons_days: [365]
    bootstrap_replicates: 2000
    figures: true
