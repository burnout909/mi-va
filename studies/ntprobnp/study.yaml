study_id: ntprobnp
site: dicom-miva
seed: 20261007

stages:
  retrieve:
    dsn_env: /data/mi-val/secrets/micdm.env
    schema: cdm
    label_concept_id: 3029187  # NT-proBNP in Serum or Plasma (LOINC 33762-6), pg/mL
    modality_concept_id: 4145308
    window_days: 1
    window_days_sens2: 7
    implausible_below: 0
    local_path_root: /scratch/mi-val/dicom
    require_local_file: true
    one_per_person: true

  profile:
    test_fraction: 0.2
    n_folds: 5
    stratify_on: none
    min_test_positives: 0

  preprocess:
    loader: dicom
    registry: registry/ntprobnp
    allow_upsample: false
    pad_policy: reject
    perturbation:
      axes:
        resample: [500]
        duration: [10]

  models:
    registry: registry/ntprobnp
    cohort_sources: [mimic-iv-ecg]
    batch_size: 64
    arms:
      - {model_id: ai-ntprobnp, training_mode: inference_only, label_def: value}

  evaluate:
    outcomes: {ntprobnp: null}
    regression_cuts: {value: [125, 300]}
    bootstrap_replicates: 2000
    figures: true
