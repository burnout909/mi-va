[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mival"
version = "0.1.0"
description = "MI-VAL: model-agnostic ECG validation framework on OMOP MI-CDM"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21", "scipy>=1.7", "jsonschema>=4.0", "pyyaml>=5.4"]

[project.optional-dependencies]
# Table I/O is optional at import time: mival.pipeline must import in the
# Python 3.9 Keras 2.7 environment even where pyarrow is unavailable.
tables = ["pandas>=1.3", "pyarrow>=8"]
# Same rule as `tables`: AUROC/AUPRC come from scikit-learn and figures from
# matplotlib, but neither may be imported at module scope — the model
# environments carry a backend and little else, and `import mival` has to work
# there. Both are imported inside the functions that need them.
metrics = ["scikit-learn>=1.0"]
figures = ["matplotlib>=3.4"]
dev = ["pytest>=7.0"]

[project.scripts]
mival = "mival.pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "weights: requires model weight files on disk",
    "torch: requires PyTorch",
    "keras: requires TensorFlow/Keras 2.7",
]
